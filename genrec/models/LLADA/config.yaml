# LLaDA Model Configuration
# Based on RPG but with diffusion-specific parameters

# Overwriting configs
metadata: sentence

# Batch sizes (larger eval batch for faster inference)
train_batch_size: 256
eval_batch_size: 128  # Increased from default 32 for faster evaluation

# Config the sentence embedding model
#   Sentence T5
sent_emb_model: sentence-transformers/sentence-t5-base
sent_emb_dim: 768
sent_emb_pca: 128
#   OpenAI Embedding Model
# sent_emb_model: text-embedding-3-large
# sent_emb_dim: 3072
# sent_emb_pca: 512
# openai_api_key: ~

sent_emb_batch_size: 512

# Config for the backbone model (GPT2)
max_item_seq_len: 50
n_embd: 448
n_layer: 2
n_head: 4
n_inner: 1024
activation_function: gelu_new
resid_pdrop: 0.0
embd_pdrop: 0.5
attn_pdrop: 0.5
layer_norm_epsilon: 1e-12
initializer_range: 0.02

# Semantic ID configs - Using 8 codes instead of 32 (faster, smaller space)
n_codebook: 8  # Changed from 32 to 8
codebook_size: 256
opq_use_gpu: False
opq_gpu_id: 0
faiss_omp_num_threads: 32

# LLaDA-specific: Diffusion parameters
diffusion_steps: 8  # Total timesteps for diffusion (T) - matched with n_codebook
mask_schedule: linear  # Masking schedule: linear, cosine, square
codes_per_step: 4  # Number of codes to determine per step (2 steps total: 8/4=2)
                   # If set to null, uses schedule-based approach
                   # Recommended: 2-4 for fast inference with 8 codes

# Code to item mapping method
code_to_item_method: count  # How to map generated codes to items
                            # 'count': Count matching codes (fast, simple)
                            # 'embedding': Use embedding similarity (robust to mismatches)
                            # 'hybrid': Combine both (best quality, slower)

# Model-specific configs
temperature: 0.07

# Graph-constrained decoding (inherited from RPG)
num_beams: 50
n_edges: 50
propagation_steps: 3
chunk_size: 1024
num_workers: 64


