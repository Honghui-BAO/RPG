# LLaDA Model Configuration
# Based on RPG but with diffusion-specific parameters

# Overwriting configs
metadata: sentence

# Batch sizes (larger eval batch for faster inference)
train_batch_size: 256
eval_batch_size: 128  # Increased from default 32 for faster evaluation

# Config the sentence embedding model
#   Sentence T5
sent_emb_model: sentence-transformers/sentence-t5-base
sent_emb_dim: 768
sent_emb_pca: 128
#   OpenAI Embedding Model
# sent_emb_model: text-embedding-3-large
# sent_emb_dim: 3072
# sent_emb_pca: 512
# openai_api_key: ~

sent_emb_batch_size: 512

# Config for the backbone model (GPT2)
max_item_seq_len: 50
n_embd: 448
n_layer: 2
n_head: 4
n_inner: 1024
activation_function: gelu_new
resid_pdrop: 0.0
embd_pdrop: 0.5
attn_pdrop: 0.5
layer_norm_epsilon: 1e-12
initializer_range: 0.02

# Semantic ID configs - Using 4 codes (extreme speed, minimal representation)
n_codebook: 4  # Changed from 32 to 4
codebook_size: 256
opq_use_gpu: False
opq_gpu_id: 0
faiss_omp_num_threads: 32

# LLaDA-specific: Diffusion parameters
diffusion_steps: 4  # Total timesteps for diffusion (T) - matched with n_codebook
mask_schedule: linear  # Masking schedule: linear, cosine, square
codes_per_step: 2  # Number of codes to determine per step (2 steps total: 4/2=2)
                   # If set to null, uses schedule-based approach
                   # With 4 codes: only 2 steps needed!

# Code to item mapping method
code_to_item_method: embedding  # For len4, MUST use embedding
                                # With 4 codes, count has only 5 levels - way too coarse
                                # 'count': NOT recommended for <16 codes
                                # 'embedding': REQUIRED for 4 codes
                                # 'hybrid': Also good for 4 codes

# Model-specific configs
temperature: 0.07

# Graph-constrained decoding (inherited from RPG)
num_beams: 50
n_edges: 50
propagation_steps: 3
chunk_size: 1024
num_workers: 64


